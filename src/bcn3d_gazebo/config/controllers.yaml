controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - Gripper_Servo_Gear_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# PID gains for the GazeboSystem hardware's internal position controller.
# Bigger p = stiffer hold against gravity. Tune if joints sag or oscillate.
gazebo_ros2_control:
  ros__parameters:
    Joint_1: {pid: {p: 1000.0, i: 1.0, d: 100.0}}
    Joint_2: {pid: {p: 1000.0, i: 1.0, d: 100.0}}
    Joint_3: {pid: {p: 1000.0, i: 1.0, d: 100.0}}
    Joint_4: {pid: {p: 500.0, i: 1.0, d: 50.0}}
    Joint_5: {pid: {p: 200.0, i: 1.0, d: 20.0}}
    Gripper_Servo_Gear_Joint: {pid: {p: 50.0, i: 0.1, d: 5.0}}
